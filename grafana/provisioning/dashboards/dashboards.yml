apiVersion: 1
providers:
  - name: lab-projects
    type: file
    disableDeletion: false
    allowUiUpdates: true            # you may edit in the UI (changes are not written back to disk)
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true   # one Grafana folder per project
