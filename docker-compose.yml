# =============================================================================
# Observability Lab - Prometheus + Grafana, 15 real-world monitoring scenarios
# -----------------------------------------------------------------------------
# Core stack (always on):   docker compose up -d --build        (or: make up)
# Databases (project 13):   make db-on   /  make db-off
# Kafka     (project 14):   make mq-on   /  make mq-off
# Image tags are pinned for reproducibility - bump them deliberately.
# =============================================================================
name: lab

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- monitoring
  prometheus:
    <<: *restart
    image: prom/prometheus:v3.1.0
    container_name: lab-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d   # SLO project needs a 30d window
      - --web.enable-lifecycle              # allows: curl -X POST :9090/-/reload
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ./projects:/lab/projects:ro         # every projects/*/alerts.yml is loaded
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway" # to reach node-exporter on the host network
    ports: ["9090:9090"]

  alertmanager:
    <<: *restart
    image: prom/alertmanager:v0.28.0
    container_name: lab-alertmanager
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./alertmanager:/etc/alertmanager:ro"]
    ports: ["9093:9093"]

  alert-logger:
    # Tiny webhook receiver: prints every notification Alertmanager sends.
    # Watch it with:  docker logs -f lab-alert-logger
    <<: *restart
    image: python:3.12-alpine
    container_name: lab-alert-logger
    command: ["python", "-u", "/app/logger.py"]
    volumes: ["./apps/alert-logger:/app:ro"]

  grafana:
    <<: *restart
    image: grafana/grafana:11.3.0
    container_name: lab-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./projects:/var/lib/grafana/dashboards:ro   # every projects/*/dashboard.json
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]

  # ----------------------------------------------------------------- exporters
  node-exporter:
    # Host metrics (projects 10-12). Host network + host PID so it sees the
    # real machine, not the container. On Docker Desktop (Mac/Windows) it
    # reports the Docker VM instead of your laptop.
    <<: *restart
    image: prom/node-exporter:v1.8.2
    container_name: lab-node-exporter
    network_mode: host
    pid: host
    command: ["--path.rootfs=/host", "--web.listen-address=:9100"]
    volumes: ["/:/host:ro,rslave"]   # if Docker complains about rslave, remove ",rslave"

  cadvisor:
    # Per-container metrics (projects 6, 7, 12)
    <<: *restart
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: lab-cadvisor
    privileged: true
    devices: ["/dev/kmsg"]
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  blackbox-exporter:
    # Synthetic probes: HTTP, TCP, ICMP, DNS, TLS certs (project 15)
    <<: *restart
    image: prom/blackbox-exporter:v0.25.0
    container_name: lab-blackbox
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    cap_add: ["NET_RAW"]             # needed for ICMP probes
    volumes: ["./blackbox:/etc/blackbox:ro"]

  # --------------------------------------------------------- demo applications
  orders-api:
    <<: *restart
    build: ./apps/demo-app
    image: lab/demo-app:latest
    container_name: lab-orders-api
    environment: { SERVICE_NAME: orders-api, APP_VERSION: "1.4.2" }
    mem_limit: 256m    # project 6: memory limit (OOM demo)
    cpus: 0.5          # project 7: CPU limit (throttling demo)
    ports: ["8081:8080"]

  payments-api:
    <<: *restart
    image: lab/demo-app:latest
    depends_on: [orders-api]           # re-uses the image built by orders-api
    container_name: lab-payments-api
    environment: { SERVICE_NAME: payments-api, APP_VERSION: "2.0.1" }
    mem_limit: 256m
    cpus: 0.5
    ports: ["8082:8080"]

  loadgen:
    # Constant synthetic traffic so every dashboard has data.
    <<: *restart
    build: ./apps/loadgen
    image: lab/loadgen:latest
    container_name: lab-loadgen
    environment:
      TARGETS: http://orders-api:8080,http://payments-api:8080
      RPS: ${LOADGEN_RPS:-10}

  # ------------------------------------------------ profile: db  (project 13)
  postgres:
    <<: *restart
    profiles: [db]
    image: postgres:16-alpine
    container_name: lab-postgres
    environment: { POSTGRES_PASSWORD: postgres }
    command: ["postgres", "-c", "max_connections=50"]  # low on purpose (saturation demo)

  postgres-exporter:
    <<: *restart
    profiles: [db]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: lab-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on: [postgres]

  redis:
    <<: *restart
    profiles: [db]
    image: redis:7.4-alpine
    container_name: lab-redis
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

  redis-exporter:
    <<: *restart
    profiles: [db]
    image: oliver006/redis_exporter:v1.62.0
    container_name: lab-redis-exporter
    environment: { REDIS_ADDR: "redis://redis:6379" }
    depends_on: [redis]

  # ------------------------------------------------ profile: mq  (project 14)
  kafka:
    <<: *restart
    profiles: [mq]
    image: apache/kafka:3.8.0
    container_name: lab-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  kafka-exporter:
    <<: *restart
    profiles: [mq]
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: lab-kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    depends_on: [kafka]

  mq-producer:
    <<: *restart
    profiles: [mq]
    build: ./apps/mq-worker
    image: lab/mq-worker:latest
    container_name: lab-mq-producer
    environment: { MODE: producer, RATE: "${PRODUCER_RATE:-20}" }
    depends_on: [kafka]

  mq-consumer:
    <<: *restart
    profiles: [mq]
    image: lab/mq-worker:latest
    container_name: lab-mq-consumer
    environment: { MODE: consumer, PROCESS_MS: "${CONSUMER_PROCESS_MS:-5}" }
    depends_on: [kafka, mq-producer]

volumes:
  prometheus-data:
  grafana-data:
