# Tries to allocate 150M with a 64Mi limit -> OOMKilled -> restart -> CrashLoopBackOff
apiVersion: apps/v1
kind: Deployment
metadata: { name: oom-demo, namespace: lab }
spec:
  replicas: 1
  selector: { matchLabels: { app: oom-demo } }
  template:
    metadata: { labels: { app: oom-demo } }
    spec:
      containers:
        - name: app
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
