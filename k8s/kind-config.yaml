# Local 3-node Kubernetes cluster for projects 08 and 09 (and k8s variants of 06/07)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: obs-lab
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30000, hostPort: 30000 }   # Grafana   -> http://localhost:30000
      - { containerPort: 30090, hostPort: 30090 }   # Prometheus -> http://localhost:30090
  - role: worker
  - role: worker
