# Alertmanager routes alerts from Prometheus to receivers.
# In the lab everything goes to `alert-logger` (docker logs -f lab-alert-logger).
# Real receivers (Slack, email, PagerDuty) are shown commented out below.

route:
  receiver: alert-logger
  group_by: [alertname, service]   # one notification per alert+service
  group_wait: 10s                  # wait to batch the first notification
  group_interval: 1m               # wait before notifying about new alerts in a group
  repeat_interval: 1h              # re-send if still firing
  routes:
    - matchers: [severity="critical"]
      receiver: alert-logger       # e.g. switch to pagerduty in production
      continue: false

# A critical alert silences the matching warning (no double paging).
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, service]

receivers:
  - name: alert-logger
    webhook_configs:
      - url: http://alert-logger:5001/
        send_resolved: true

