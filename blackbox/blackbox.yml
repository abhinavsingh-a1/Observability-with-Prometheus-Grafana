modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: []        # empty = any 2xx
      follow_redirects: true

  http_2xx_insecure:                # used only to read expiry of broken certs
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      tls_config: { insecure_skip_verify: true }

  tcp_connect:
    prober: tcp
    timeout: 5s

  icmp:
    prober: icmp
    timeout: 5s
    icmp: { preferred_ip_protocol: ip4 }

  dns_prometheus_io:                # target = DNS server, query is fixed here
    prober: dns
    timeout: 5s
    dns:
      query_name: prometheus.io
      query_type: A
      preferred_ip_protocol: ip4
